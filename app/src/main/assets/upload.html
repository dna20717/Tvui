<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TVUI · Hintergrund</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, system-ui, sans-serif; color: #fff;
    background:
      radial-gradient(circle at 18% 22%, #2ee6c5 0, transparent 42%),
      radial-gradient(circle at 82% 28%, #8a5cff 0, transparent 44%),
      radial-gradient(circle at 60% 92%, #ff5ca8 0, transparent 42%),
      #0b1026;
  }
  .card {
    width: min(90vw, 520px); padding: 34px; border-radius: 34px; box-sizing: border-box;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.35);
    -webkit-backdrop-filter: blur(30px) saturate(160%);
    backdrop-filter: blur(30px) saturate(160%);
    box-shadow: 0 24px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4);
  }
  h1 { margin: 0 0 6px; font-weight: 600; font-size: 28px; }
  p { margin: 0 0 24px; opacity: .8; line-height: 1.4; }
  label.btn {
    display: block; text-align: center; padding: 18px; border-radius: 22px;
    background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.4);
    font-size: 18px; font-weight: 600; cursor: pointer;
  }
  label.btn:active { transform: scale(.98); }
  input { display: none; }
  #preview { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 20px; margin-top: 22px; display: none; }
  #status { margin-top: 16px; text-align: center; min-height: 1.4em; font-size: 17px; }
</style>
</head>
<body>
<div class="card">
  <h1>Neuer Hintergrund ✨</h1>
  <p>Wähle ein Foto. Es erscheint sofort auf deinem Fernseher.</p>
  <label class="btn" for="file">Foto auswählen</label>
  <input id="file" type="file" accept="image/*">
  <img id="preview" alt="">
  <div id="status"></div>
</div>
<script>
  var input = document.getElementById('file');
  var preview = document.getElementById('preview');
  var statusEl = document.getElementById('status');

  input.onchange = function () {
    var file = input.files[0];
    if (!file) return;
    statusEl.textContent = 'Wird vorbereitet …';
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      // Auf max. 2560 px verkleinern, damit der alte Fernseher nicht ins Schwitzen kommt
      var max = 2560, w = img.naturalWidth, h = img.naturalHeight;
      var s = Math.min(1, max / Math.max(w, h));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(w * s);
      canvas.height = Math.round(h * s);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      preview.src = url;
      preview.style.display = 'block';
      canvas.toBlob(function (blob) {
        statusEl.textContent = 'Wird gesendet …';
        fetch('/upload', { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: blob })
          .then(function (r) {
            statusEl.textContent = r.ok
              ? 'Fertig! Schau auf deinen Fernseher 📺'
              : 'Das hat nicht geklappt. Probier ein anderes Foto.';
          })
          .catch(function () { statusEl.textContent = 'Keine Verbindung zum Fernseher.'; });
      }, 'image/jpeg', 0.88);
    };
    img.onerror = function () { statusEl.textContent = 'Dieses Bild kann ich nicht lesen.'; };
    img.src = url;
  };
</script>
</body>
</html>
